<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable | L'Éclat des Flots</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
  :root { --accent: #0B3A67; --text: #072948; --muted: #64758a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--text); background: #FFFFFF;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px; -webkit-font-smoothing: antialiased;
  }
  .logo { height: 46px; width: auto; margin-bottom: 34px; }
  .code { font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  h1 { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 14px; }
  p { font-size: 16px; line-height: 1.6; color: color-mix(in srgb, var(--text) 72%, transparent); max-width: 44ch; margin: 0 0 28px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    background: var(--accent); color: #FFFFFF; font-size: 15px; font-weight: 500;
    padding: 14px 26px; border-radius: 999px; transition: background .2s ease;
  }
  .btn:hover { background: #072948; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
  <img class="logo" src="/assets/logo-nav.png" alt="L'Éclat des Flots">
  <p class="code">Erreur 404</p>
  <h1>Cette page est introuvable</h1>
  <p>Le lien est peut-être ancien ou incorrect. Revenez à l'accueil pour retrouver nos services et demander un devis.</p>
  <a class="btn" href="/">Retour à l'accueil</a>
</body>
</html>
